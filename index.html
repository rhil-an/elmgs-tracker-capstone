<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ELMGS Tracker frontend prototype for international student stay compliance." />
    <title>ELMGS Tracker · ISSD workspace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <p class="brand-mark">ELMGS</p>
          <p>HELP University</p>
          <small>International Student Services</small>
        </div>
        <nav class="navigation" aria-label="Main navigation">
          <button class="nav-link is-active" data-page="dashboard">Overview</button>
          <button class="nav-link" data-page="review">Review queue <span id="queue-count" class="nav-count">0</span></button>
          <button class="nav-link" data-page="students">Student records</button>
          <button class="nav-link" data-page="alerts">Alerts and actions</button>
          <button class="nav-link" data-page="reports">Reports</button>
        </nav>
        <div class="sidebar-tip"><strong>Prototype shortcut</strong><span>Open a pending record, then verify or return it for correction.</span></div>
        <div class="sidebar-user"><span class="avatar">IA</span><div><strong>ISSD administrator</strong><small>Prototype mode</small></div></div>
      </aside>
      <main class="content"><div id="app" aria-live="polite"></div></main>
    </div>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
